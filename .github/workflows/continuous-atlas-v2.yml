name: Validate continuous atlas v2

on:
  push:
    branches:
      - map/finish-continuous-atlas-1300-20260923

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install map dependency
        run: python -m pip install 'shapely==2.1.2'
      - name: Build continuous atlas
        run: python scripts/build-map.py
      - name: Validate topology
        run: python tests/map-topology.py
      - name: Check map JavaScript
        run: node --check src/map.js
      - name: Run current game tests
        run: node --test tests/diplomacy.test.js
      - name: Verify runtime no longer targets legacy atlas
        run: |
          if grep -R "assets/atlas.json" -n src index.html; then
            echo "Legacy atlas is still referenced by runtime code."
            exit 1
          fi
      - name: Commit generated atlas
        shell: bash
        run: |
          if git diff --quiet -- assets/atlas-1300-v2.json assets/map-land.json; then
            echo "Generated atlas already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atlas-1300-v2.json assets/map-land.json
          git commit -m "Generate continuous 1300 atlas v2"
          git push
