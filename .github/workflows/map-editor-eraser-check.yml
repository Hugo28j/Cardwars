name: Validate visible map eraser

on:
  push:
    branches:
      - fix/map-editor-visible-eraser-20260923

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract editor module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('map-editor.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          assert m, 'module script missing'
          Path('/tmp/map-editor.mjs').write_text(m.group(1))
          PY
      - name: Syntax check
        run: node --check /tmp/map-editor.mjs
      - name: Verify eraser wiring
        run: |
          grep -q "editor-erased-border" map-editor.html
          grep -q "e.button===2" map-editor.html
          grep -q "eraseAtEvent" map-editor.html
          grep -q "Gum: aan/uit" map-editor.html
      - name: Ensure game page unchanged
        run: "! grep -q 'map-editor.html' index.html"
