name: Validate paint map editor

on:
  push:
    branches:
      - fix/map-editor-paint-borders-20260923

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract editor module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('map-editor.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          assert m
          Path('/tmp/editor.mjs').write_text(m.group(1))
          PY
      - name: Syntax check
        run: node --check /tmp/editor.mjs
      - name: Verify Paint behavior
        run: |
          grep -q "globalCompositeOperation='destination-out'" map-editor.html
          grep -q "e.button===2?'erase'" map-editor.html
          grep -q "paint-draw" map-editor.html
          grep -q "paint-erase" map-editor.html
          grep -q "Path2D" map-editor.html
          grep -q "cardwars-map-paint-v3" map-editor.html
      - name: Verify editor stays standalone
        run: "! grep -q 'map-editor.html' index.html"
