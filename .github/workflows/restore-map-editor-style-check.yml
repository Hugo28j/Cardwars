name: Validate restored map and editor line style

on:
  push:
    branches:
      - fix/restore-map-and-match-editor-lines-20260923

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game map syntax
        run: node --check src/map.js
      - name: Check editor syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('map-editor.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          assert m, 'editor module missing'
          Path('/tmp/map-editor.mjs').write_text(m.group(1))
          PY
          node --check /tmp/map-editor.mjs
      - name: Verify old game map restored
        run: |
          test ! -f assets/map-paint-import-20260923.json
          ! grep -q "renderMapPaintOverlay" src/map.js
          ! grep -q "map-paint-import-20260923.json" src/map.js
          grep -q "restored-old-map-v1" src/app.js
          grep -q "restored-old-map-v1" index.html
      - name: Verify editor matches province border style
        run: |
          grep -q "ctx.strokeStyle='#7a8781'" map-editor.html
          grep -q "ctx.globalAlpha=.30" map-editor.html
          grep -q "ctx.lineWidth=.90\*unit" map-editor.html
          grep -q "Gumgrootte" map-editor.html
