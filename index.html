<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101919">
  <meta name="description" content="Explore researched European cities around 1300 CE, compare realms and develop provinces in Cardwars.">
  <title>Cardwars · The Age of Realms</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23101919'/%3E%3Cpath d='M15 20l10 9 7-15 7 15 10-9-4 28H19z' fill='%23cfb074'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260922-army-building-ui-v58">
</head>
<body>
 <div id="app"><div class="boot"><span class="eyebrow">CARDWARS</span><p>Opening the atlas…</p></div></div>
 <dialog id="modal"></dialog>
 <div id="toast" role="status" aria-live="polite"></div>
 <input id="import-file" type="file" accept="application/json,.json" hidden>
 <noscript>Cardwars requires JavaScript to open packs and explore the map.</noscript>
 <script>
  window.__CARDWARS_BOOT_ERROR__='';
  window.addEventListener('error',function(e){window.__CARDWARS_BOOT_ERROR__=e&&e.message?e.message:'JavaScript failed to load.';});
  window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;window.__CARDWARS_BOOT_ERROR__=(r&&r.message)||String(r||'Promise rejected while loading.');});
 </script>
 <script type="module" src="src/app.js?v=20260922-army-building-ui-v58"></script>
 <script>
  window.setTimeout(function(){
   var app=document.getElementById('app');
   if(!window.__CARDWARS_BOOTED__&&app&&app.querySelector('.boot')){
    var msg=window.__CARDWARS_BOOT_ERROR__||'The game could not finish loading.';
    app.innerHTML='<div class="boot boot-error"><span class="eyebrow">CARDWARS</span><p>Loading failed.</p><small>'+String(msg).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</small><button onclick="location.reload()" style="margin-top:16px">Refresh</button></div>';
   }
  },6000);
 </script>
</body>
</html>
